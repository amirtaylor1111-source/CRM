[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notetaker"
version = "0.1.0"
description = "Local, consent-first meeting recorder and transcriber that feeds Claude Code"
requires-python = ">=3.11"
dependencies = [
    "soundcard>=0.4.3",   # WASAPI loopback; no driver install on Windows
    "numpy>=1.24",
    "onnx-asr[cpu,hub]>=0.12",  # Parakeet via ONNX Runtime; cpu= the runtime,
                                # hub= model download. Neither is implied.
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]   # fallback engine
dev = ["pytest>=8.0"]

[project.scripts]
mtg = "notetaker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["notetaker"]

[tool.setuptools.package-data]
notetaker = ["ui/*.html"]
