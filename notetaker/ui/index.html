<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting Notetaker</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#14161c; --panel-2:#1b1e26; --line:#242833;
    --fg:#eef0f5; --muted:#8b91a1; --dim:#5c6272;
    --accent:#4f8cff; --accent-2:#3b6fd1; --rec:#ff4b4b; --amber:#f5b942; --ok:#3ddc84;
    --radius:16px; --shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;max-width:560px;margin:0 auto;padding:22px 22px 16px}

  /* header */
  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .hdr h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;color:var(--muted)}
  .hdr .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:8px;vertical-align:middle;transition:background .3s}
  .hdr .dot.rec{background:var(--rec);box-shadow:0 0 0 0 rgba(255,75,75,.6);animation:ping 1.4s infinite}
  .hdr .dot.busy{background:var(--amber)}
  .hdr .dot.ok{background:var(--ok)}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,75,75,.55)}70%{box-shadow:0 0 0 10px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
  .hdr .log{font-size:12px;color:var(--dim);cursor:pointer}
  .hdr .log:hover{color:var(--muted)}

  /* next-up card */
  .next{
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;
  }
  .next .cal{width:40px;height:40px;border-radius:12px;background:rgba(79,140,255,.12);display:grid;place-items:center;color:var(--accent);flex:none}
  .next .cal svg{width:20px;height:20px}
  .next .t{flex:1;min-width:0}
  .next .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .next .t span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .next.empty .cal{background:rgba(139,145,161,.1);color:var(--dim)}
  .next.empty .t b{color:var(--muted);font-weight:500}

  /* fields */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;margin-bottom:12px}
  .field{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .field label{width:52px;color:var(--muted);font-size:13px;flex:none}
  .field input{
    flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px;padding:2px 0;min-width:0
  }
  .field input::placeholder{color:var(--dim)}
  .field input:disabled{color:var(--muted)}

  /* consent */
  .consent{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
  .consent .say{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .consent q{display:block;quotes:"\201C" "\201D";color:var(--fg);font-style:italic;line-height:1.5;margin-bottom:12px}
  .toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:4px 0}
  .toggle span{font-weight:500}
  .sw{position:relative;width:44px;height:26px;border-radius:13px;background:#2a2e3a;transition:background .2s;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .toggle input{display:none}
  .toggle input:checked+.sw{background:var(--ok)}
  .toggle input:checked+.sw::after{transform:translateX(18px)}
  .toggle.small span{color:var(--muted);font-weight:400;font-size:13px}
  .toggle.small .sw{transform:scale(.8);transform-origin:right center}
  .toggle input:disabled+.sw{opacity:.4}

  /* the button */
  .big{
    width:100%;border:0;border-radius:18px;padding:18px;font:inherit;font-size:17px;font-weight:700;letter-spacing:.2px;
    color:#fff;cursor:pointer;transition:transform .08s,background .25s,box-shadow .25s,opacity .25s;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .big:active{transform:scale(.985)}
  .big:disabled{cursor:not-allowed;opacity:.45}
  .big.idle{background:var(--accent);box-shadow:0 10px 30px rgba(79,140,255,.28)}
  .big.idle:hover:not(:disabled){background:var(--accent-2)}
  .big.rec{background:var(--rec);box-shadow:0 10px 30px rgba(255,75,75,.28)}
  .big.busy{background:var(--panel-2);color:var(--muted);box-shadow:none}
  .big.done{background:var(--ok);color:#06210f;box-shadow:0 10px 30px rgba(61,220,132,.25)}
  .big .ico{width:14px;height:14px;border-radius:50%;background:currentColor;flex:none}
  .big.rec .ico{border-radius:3px}
  .big .clock{font-variant-numeric:tabular-nums;font-weight:600;opacity:.9}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;flex:none}
  @keyframes rot{to{transform:rotate(360deg)}}

  .status{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin:10px 0 6px}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--rec)}

  /* secondary */
  .sec{width:100%;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:12px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:12px;transition:background .2s,border-color .2s}
  .sec:hover{background:var(--panel);border-color:#333947}
  .sec.hi{background:var(--panel-2);border-color:transparent}

  /* recent */
  .recent{flex:1;min-height:0;display:flex;flex-direction:column}
  .recent h2{margin:4px 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .list{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  .list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:4px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--panel-2)}
  .row .st{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .row .st.tx{background:var(--accent)} .row .st.nt{background:var(--ok)}
  .row .m{flex:1;min-width:0}
  .row .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .row .m span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .row .d{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .row .act{flex:none;font-size:12px;color:var(--accent);opacity:0;transition:opacity .15s;padding:4px 8px;border-radius:8px}
  .row:hover .act{opacity:1}
  .row .act:hover{background:rgba(79,140,255,.12)}
  .empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}

  .foot{display:flex;gap:18px;justify-content:center;margin-top:12px}
  .foot a{color:var(--dim);font-size:12px;cursor:pointer;text-decoration:none}
  .foot a:hover{color:var(--muted)}

  /* doctor sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
  .sheet.on{display:flex}
  .sheet .box{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-height:80vh;display:flex;flex-direction:column}
  .sheet .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sheet .bar b{font-weight:600}
  .sheet .bar a{color:var(--muted);cursor:pointer;font-size:13px}
  .sheet pre{margin:0;padding:14px 16px;overflow:auto;font:12px/1.5 Consolas,"Cascadia Mono",ui-monospace,monospace;color:var(--fg);white-space:pre-wrap}
  .sheet pre .pass{color:var(--ok)} .sheet pre .fail{color:var(--rec)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#22262f;border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow);max-width:90%}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <h1><span class="dot" id="dot"></span>Meeting Notetaker</h1>
    <span class="log" id="setupLink">Check setup</span>
  </div>

  <div class="next" id="next">
    <div class="cal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    </div>
    <div class="t"><b id="nextTitle">Loading…</b><span id="nextSub"></span></div>
  </div>

  <div class="card">
    <div class="field"><label>Meeting</label><input id="title" placeholder="What is this call?" autocomplete="off"></div>
    <div class="field"><label>With</label><input id="people" placeholder="Names, comma separated" autocomplete="off"></div>
  </div>

  <div class="consent" id="consentBox">
    <div class="say">Say this before you start</div>
    <q id="disclosure">…</q>
    <label class="toggle"><span>I've told them</span><input type="checkbox" id="consent"><i class="sw"></i></label>
    <label class="toggle small"><span>Just me — nobody else on the call</span><input type="checkbox" id="solo"><i class="sw"></i></label>
  </div>

  <button class="big idle" id="big" disabled><i class="ico"></i><span id="bigText">Start recording</span></button>
  <div class="status" id="status">Ready</div>

  <button class="sec" id="writeup" style="display:none">Write up notes in Claude</button>

  <div class="recent">
    <h2>Recent</h2>
    <div class="list" id="list"><div class="empty">No meetings yet</div></div>
  </div>

  <div class="foot">
    <a id="openFolder">Open folder</a>
    <a id="reset" style="display:none">New recording</a>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <div class="bar"><b>Setup check</b><a id="closeSheet">Close</a></div>
    <pre id="sheetOut">Checking…</pre>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TOKEN="__TOKEN__";
const $=id=>document.getElementById(id);
const api=async(path,body)=>{
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  return r.json();
};
let S={state:"idle"}, lastState="", filledFromCalendar=false, wroteUpFor="";

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}

function gate(){
  const idle=S.state==="idle"||S.state==="done"||S.state==="error";
  const ok=idle&&($("consent").checked||$("solo").checked);
  $("big").disabled=!ok&&idle;
  $("consent").disabled=!idle; $("solo").disabled=!idle;
  $("title").disabled=!idle; $("people").disabled=!idle;
}
$("consent").addEventListener("change",gate);
$("solo").addEventListener("change",e=>{ if(e.target.checked){$("people").placeholder="Just you";} else {$("people").placeholder="Names, comma separated";} gate(); });

function render(){
  const st=S.state, big=$("big"), txt=$("bigText"), dot=$("dot"), status=$("status");
  big.className="big "+({idle:"idle",done:"idle",error:"idle",recording:"rec",transcribing:"busy"}[st]||"idle");
  big.innerHTML="";
  if(st==="recording"){big.append(el("i","ico"),el("span","",`Stop`),el("span","clock",S.elapsed||"00:00"));dot.className="dot rec";}
  else if(st==="transcribing"){big.append(el("i","spin"),el("span","","Working…"));dot.className="dot busy";}
  else if(st==="done"){big.className="big done";big.append(el("i","ico"),el("span","","Record another"));dot.className="dot ok";}
  else {big.append(el("i","ico"),el("span","",st==="error"?"Try again":"Start recording"));dot.className="dot";}

  status.className="status"+(st==="done"?" ok":st==="error"?" err":"");
  status.textContent = st==="recording"?"Recording — wear headphones":
                       st==="transcribing"?(S.detail||"Transcribing…"):
                       st==="done"?"Done — write it up in Claude when you're ready":
                       st==="error"?(S.detail||"Something went wrong"):"Ready";

  $("writeup").style.display = st==="done"?"block":"none";
  $("writeup").className = "sec hi";
  $("reset").style.display = (st==="done"||st==="error")?"inline":"none";

  // next-up
  const sg=S.suggestion||{}, nx=$("next");
  if(sg.title){ nx.classList.remove("empty"); $("nextTitle").textContent=sg.title; $("nextSub").textContent=(sg.headline.split(" — ")[1]||"")+(sg.participants?.length?" · "+sg.participants.join(", "):""); }
  else { nx.classList.add("empty"); const u=(S.upcoming||[])[0]; $("nextTitle").textContent=u?`Next: ${u.subject}`:"Nothing on the calendar"; $("nextSub").textContent=u?`${u.when}${u.with?" · "+u.with:""}`:"Sync with /calendar in Claude Code"; }
  if(sg.title && !filledFromCalendar && (st==="idle")){ if(!$("title").value)$("title").value=sg.title; if(!$("people").value&&sg.participants?.length)$("people").value=sg.participants.join(", "); filledFromCalendar=true; }

  $("disclosure").textContent=S.disclosure||"";

  // recent
  const list=$("list"); list.innerHTML="";
  if(!(S.recent||[]).length){list.append(el("div","empty","No meetings yet"));}
  for(const m of S.recent||[]){
    const row=el("div","row");
    row.append(el("i","st "+(m.has_notes?"nt":m.transcribed?"tx":"")));
    const mid=el("div","m"); mid.append(el("b","",m.title), el("span","",m.with||"—")); row.append(mid);
    row.append(el("span","d",m.date.slice(5)));
    if(m.transcribed&&!m.has_notes){const a=el("span","act","Write up");a.onclick=e=>{e.stopPropagation();writeUp(m.id);};row.append(a);}
    row.onclick=()=>api("/api/open",{meeting_id:m.id});
    list.append(row);
  }
  gate();
  if(st!==lastState){ if(st==="done"){ try{ new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IAAAAAAAAAEAAQBErAAAiFgBAAIAEABkYXRhAAAAAA==").play().catch(()=>{});}catch(e){} } lastState=st; }
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

async function poll(){ try{ S=await api("/api/state"); render(); }catch(e){ $("status").textContent="Lost connection to the app"; $("status").className="status err"; } }

$("big").onclick=async()=>{
  if(S.state==="recording"){ const r=await api("/api/stop",{}); if(!r.ok)toast(r.error); return; }
  if(S.state==="done"||S.state==="error"){ await api("/api/reset",{}); filledFromCalendar=false; $("consent").checked=false; }
  const r=await api("/api/start",{title:$("title").value,participants:$("people").value,consent:$("consent").checked,solo:$("solo").checked});
  if(!r.ok) toast(r.error||"Could not start");
  poll();
};
async function writeUp(id){
  const r=await api("/api/writeup",{meeting_id:id||S.meeting_id||""});
  if(r.ok) toast("Opening Claude Code…"); else if(r.command){ try{await navigator.clipboard.writeText(r.command);}catch(e){} toast(`Claude Code not found. Copied "${r.command}" — paste it into Claude Code.`); } else toast(r.error||"Could not open Claude Code");
}
$("writeup").onclick=()=>writeUp("");
$("reset").onclick=async()=>{await api("/api/reset",{});filledFromCalendar=false;$("consent").checked=false;$("title").value="";$("people").value="";poll();};
$("openFolder").onclick=()=>api("/api/open",{});
$("setupLink").onclick=async()=>{$("sheet").classList.add("on");$("sheetOut").textContent="Checking…";const r=await api("/api/doctor");$("sheetOut").innerHTML=(r.output||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\bPASS\b/g,'<span class="pass">PASS</span>').replace(/\bFAIL\b/g,'<span class="fail">FAIL</span>');};
$("closeSheet").onclick=()=>$("sheet").classList.remove("on");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("on");};

poll(); setInterval(poll,600);
</script>
</body>
</html>
